name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # --- Install Allure via npm (stable and works on any Ubuntu, including noble 24.04) ---
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Allure CLI
        run: |
          npm install -g allure-commandline
          allure --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ github.sha }}
          restore-keys: gradle-

      - name: Run Tests
        run: ./gradlew --no-daemon test

      - name: Generate Allure Report
        run: ./gradlew allureReport

      - name: Upload Allure Report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/allure-report/

      - name: Upload Allure Raw Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results/